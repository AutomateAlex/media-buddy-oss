[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-buddy-backend"
version = "0.1.0"
description = "Video Co-pilot desktop app — FastAPI backend"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [
    { name = "Media Buddy contributors" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "Pillow>=10.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "edge-tts>=7.0.0",
    "keyring>=25.0.0",
    "httpx>=0.27",
    "pyjwt>=2.9.0",
    # 繁↔简(OpenCC 纯 Python 版):送 TTS 前繁转简(治口音漂移)+ 繁体字幕(s2twp)。
    # 缺失时代码优雅降级为原文,但那样繁转简/繁体字幕都失效 —— fleet/worker 必须装。
    "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "red_line_e2e: end-to-end red-team tests that hit the real Studio agent backend + cloud LLM. Skipped by default. Run with: pytest -m red_line_e2e",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["backend*"]
